quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true
quarkus.flyway.validate-on-migrate=true
quarkus.smallrye-openapi.info-title=Geographic Reference API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Reactive read-only API for countries and administrative divisions
quarkus.swagger-ui.always-include=false

%dev.quarkus.datasource.username=${DB_USERNAME:postgres}
%dev.quarkus.datasource.password=${DB_PASSWORD:admin}
%dev.quarkus.datasource.reactive.url=${DB_REACTIVE_URL:postgresql://127.0.0.1:5432/geographic_reference_service}
%dev.quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://127.0.0.1:5432/geographic_reference_service}

%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.reactive.url=${DB_REACTIVE_URL}
%prod.quarkus.datasource.jdbc.url=${DB_JDBC_URL}

%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.image-name=docker.io/library/postgres:18.4
%test.quarkus.datasource.devservices.db-name=geographic_reference_service
%test.quarkus.datasource.devservices.username=postgres
%test.quarkus.datasource.devservices.password=admin
%test.quarkus.flyway.locations=db/migration,db/test-migration
