components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        RS256 JWT access token validated for signature, configured issuer, audience
        `geographic-reference-service`, expiration, optional not-before, and subject. Exact
        permissions are space-delimited values in `scope`; permission implication and opaque
        token fallback are not supported. Standard OpenAPI security scope arrays remain empty
        because this is an HTTP bearer scheme; `x-required-permissions` states authorization.
  parameters:
    CountryCode:
      name: countryCode
      in: path
      required: true
      description: ISO 3166-1 alpha-2, alpha-3, or exactly three numeric digits. Alphabetic input is locale-neutrally uppercased; numeric input remains a string and preserves leading zeroes.
      schema:
        type: string
        minLength: 2
        maxLength: 3
        pattern: '^(?:[A-Za-z]{2}|[A-Za-z]{3}|[0-9]{3})$'
      examples:
        syntheticAlpha2:
          value: ZZ
        syntheticAlpha3Lowercase:
          value: zzz
        syntheticNumeric:
          value: '999'
    CanonicalCode:
      name: canonicalCode
      in: path
      required: true
      description: "Unchanged Ecuador INEC DPA code: two digits for a province, four for a canton, or six for a level-three area. Leading zeroes are significant."
      schema:
        type: string
        minLength: 2
        maxLength: 6
        pattern: '^(?:[0-9]{2}|[0-9]{4}|[0-9]{6})$'
      example: '990150'
    SchemeCode:
      name: schemeCode
      in: path
      required: true
      description: Bounded external-identifier scheme code, normalized to uppercase before support evaluation. V1 supports only `EC_INEC_DPA` and `ISO_3166_2`; another syntactically valid value returns `UNSUPPORTED_IDENTIFIER_SCHEME`.
      schema:
        type: string
        minLength: 1
        maxLength: 32
        pattern: '^[A-Za-z][A-Za-z0-9_]*$'
      examples:
        dpaScheme:
          value: ec_inec_dpa
        isoSubdivisionScheme:
          value: ISO_3166_2
    IdentifierValue:
      name: identifierValue
      in: path
      required: true
      description: Scheme-specific identifier. `EC_INEC_DPA` requires 2, 4, or 6 digits; `ISO_3166_2` is uppercased and requires `EC-[A-Z]{1,2}`. The broad transport bound permits stable scheme-specific validation errors.
      schema:
        type: string
        minLength: 1
        maxLength: 35
      examples:
        syntheticDpa:
          value: '990150'
        syntheticIsoSubdivisionLowercase:
          value: ec-zz
    Page:
      name: page
      in: query
      required: false
      description: One-based page number. Omission selects page 1. Zero, negative, malformed, or repeated values return `INVALID_PAGINATION` or `DUPLICATE_QUERY_PARAMETER`.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 2147483647
        default: 1
      example: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: Requested page size. Omission selects 50; valid values are 1 through 100. Values above 100 return `PAGE_SIZE_LIMIT_EXCEEDED`.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 50
      example: 50
    Language:
      name: language
      in: query
      required: false
      description: Canonicalizable BCP 47 language tag of at most 35 characters. Java 25 `Locale.Builder#setLanguageTag` validation and canonicalization are normative; no regular-expression approximation is used. On item and hierarchy operations it selects exact-tag, then primary-language, then default-name fallback. On name lists it is an exact canonical-tag filter. A valid unsupported tag falls back or yields an empty filtered page; an invalid or repeated value is rejected.
      schema:
        type: string
        minLength: 2
        maxLength: 35
        x-normative-validator: java.util.Locale.Builder#setLanguageTag (Java 25)
      examples:
        primary:
          value: es
        regional:
          value: es-EC
    NameType:
      name: nameType
      in: query
      required: false
      description: Uppercase literal name-record type filter. Lowercase, unsupported, or repeated values are rejected and never trigger presentation fallback.
      schema:
        $ref: '#/components/schemas/NameType'
      example: OFFICIAL
    AsOf:
      name: asOf
      in: query
      required: false
      description: Strict ISO `YYYY-MM-DD` calendar date. Omission means the current UTC date and current lifecycle rules. An explicit date, including a valid future date, uses ordinary temporal visibility. A date before the active endpoint's revision-bound coverage start is rejected; the initial country and Ecuador division coverages start on 2026-01-01.
      schema:
        type: string
        format: date
        minLength: 10
        maxLength: 10
        pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
      example: '2030-06-15'
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: One bounded HTTP entity-tag list or wildcard. Weak comparison is used after the request would otherwise produce a successful representation. A match returns bodyless 304; malformed or excessive input is rejected as unsupported input.
      schema:
        type: string
        minLength: 1
        maxLength: 4096
      examples:
        currentValidator:
          value: 'W/"grs-v1-yP7sA2k0H6Qq1ic0r2pyF6jqNsRiwJ3ESJDV-zcGqLM"'
        wildcard:
          value: '*'
  headers:
    ETag:
      description: Weak, representation-specific cache validator. It does not authorize or coordinate writes.
      required: true
      schema:
        type: string
        pattern: '^W/"grs-v1-[A-Za-z0-9_-]{43}"$'
      example: 'W/"grs-v1-yP7sA2k0H6Qq1ic0r2pyF6jqNsRiwJ3ESJDV-zcGqLM"'
    CatalogCacheControl:
      description: Permits private storage but requires successful revalidation before reuse.
      required: true
      schema:
        type: string
        const: private, no-cache
      example: private, no-cache
    NoStoreCacheControl:
      description: Prevents storage of operational and problem responses.
      required: true
      schema:
        type: string
        const: no-store
      example: no-store
    CatalogRevision:
      description: Immutable activated catalog revision used for this complete response snapshot.
      required: true
      schema:
        $ref: '#/components/schemas/CatalogRevision'
      example: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    ResponseDate:
      description: HTTP response date in IMF-fixdate form; catalog validators include the effective UTC calendar date.
      required: true
      schema:
        type: string
        minLength: 29
        maxLength: 29
        pattern: '^(Mon|Tue|Wed|Thu|Fri|Sat|Sun), [0-9]{2} (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) [0-9]{4} [0-9]{2}:[0-9]{2}:[0-9]{2} GMT$'
      example: Sat, 25 Jul 2026 15:04:05 GMT
    TraceId:
      description: Safe request trace or correlation identifier.
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
      example: 4bf92f3577b34da6a3ce929d0e0e4736
    WwwAuthenticate:
      description: Bearer authentication challenge without token or confidential diagnostic data.
      required: true
      schema:
        type: string
        pattern: '^Bearer(?: .*)?$'
      example: Bearer
  schemas:
    CatalogRevision:
      type: string
      description: Public immutable identity derived from the approved record manifest SHA-256 digest.
      pattern: '^sha256:[a-f0-9]{64}$'
      minLength: 71
      maxLength: 71
      example: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    LifecycleStatus:
      type: string
      description: Public lifecycle state. `DRAFT` is deliberately absent because it is never externally visible. Current queries emit only `ACTIVE`; historical queries may also emit `DEPRECATED` or `RETIRED`.
      enum: [ACTIVE, DEPRECATED, RETIRED]
      example: ACTIVE
    IdentifierStatus:
      type: string
      description: Identifier lifecycle state. Current resolution includes only `ACTIVE`; historical resolution may include all declared values when temporally valid. Identifiers have no public draft state.
      enum: [ACTIVE, DEPRECATED, RETIRED]
      example: ACTIVE
    NameType:
      type: string
      enum: [OFFICIAL, COMMON, SHORT, ALTERNATIVE, HISTORICAL]
      description: Fixed literal name classification and sorting order as listed by this enum.
      example: OFFICIAL
    DivisionTypeCode:
      type: string
      enum: [PROVINCE, CANTON, CANTONAL_SEAT_AREA, RURAL_PARISH]
      description: Stable public Ecuador division type. The final two types both occupy hierarchy level three.
      example: PROVINCE
    ValidityPeriod:
      type: object
      additionalProperties: false
      description: Half-open temporal interval. `validFrom` is inclusive, `validUntil` is exclusive, and null is open-ended. If both are non-null, the end is later than the start.
      required: [validFrom, validUntil]
      properties:
        validFrom:
          type: [string, 'null']
          format: date
          description: Inclusive source-backed validity start, or null when no record boundary is known.
        validUntil:
          type: [string, 'null']
          format: date
          description: Exclusive source-backed validity end, or null when no end is known.
    Provenance:
      type: object
      additionalProperties: false
      description: Approved, non-confidential source lineage. It never identifies an HTTP caller or exposes internal source-file locations.
      required: [sourceAuthority, dataset, sourceRevision, sourceRecordReference, sourceDigest]
      properties:
        sourceAuthority:
          type: string
          minLength: 1
          maxLength: 200
        dataset:
          type: string
          minLength: 1
          maxLength: 200
        sourceRevision:
          type: string
          minLength: 1
          maxLength: 100
        effectiveDate:
          type: [string, 'null']
          format: date
          description: Source effective date when the source supplies one; omitted or null otherwise. A release date or API coverage start must never be inferred as an effective date.
        sourceRecordReference:
          type: string
          minLength: 1
          maxLength: 500
          description: Public source object, workbook row, or deterministic manifest-rule reference. It contains no private filesystem location.
        sourceDigest:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
          description: SHA-256 of the exact selected source artifact referenced by this row's provenance, not the source archive or relational-projection digest.
    SelectedName:
      type: object
      additionalProperties: false
      description: Presentation name selected by exact language, primary-language fallback, or default-name fallback. Omitted `language` uses the default name.
      required: [value, language, nameType, selection]
      properties:
        value:
          type: string
          minLength: 1
          maxLength: 500
        language:
          type: string
          minLength: 2
          maxLength: 35
          x-normative-validator: java.util.Locale.Builder#setLanguageTag (Java 25)
        nameType:
          $ref: '#/components/schemas/NameType'
        selection:
          type: string
          enum: [EXACT, PRIMARY_LANGUAGE, DEFAULT]
    CountryReference:
      type: object
      additionalProperties: false
      required: [alpha2, href]
      properties:
        alpha2:
          type: string
          const: EC
        href:
          type: string
          format: uri-reference
          const: /v1/countries/EC
    DivisionReference:
      oneOf:
        - $ref: '#/components/schemas/ProvinceDivisionReference'
        - $ref: '#/components/schemas/CantonDivisionReference'
      description: Same-country immediate parent reference. V1 parents can only be a province or canton.
    ProvinceDivisionReference:
      type: object
      additionalProperties: false
      required: [countryCode, canonicalCode, typeCode, href]
      properties:
        countryCode:
          type: string
          const: EC
        canonicalCode:
          type: string
          pattern: '^[0-9]{2}$'
        typeCode:
          type: string
          const: PROVINCE
        href:
          type: string
          format: uri-reference
          pattern: '^/v1/countries/EC/divisions/[0-9]{2}$'
    CantonDivisionReference:
      type: object
      additionalProperties: false
      required: [countryCode, canonicalCode, typeCode, href]
      properties:
        countryCode:
          type: string
          const: EC
        canonicalCode:
          type: string
          pattern: '^[0-9]{4}$'
        typeCode:
          type: string
          const: CANTON
        href:
          type: string
          format: uri-reference
          pattern: '^/v1/countries/EC/divisions/[0-9]{4}$'
    Country:
      type: object
      additionalProperties: false
      description: Canonical country or ISO-recognized territory representation. Independence is intentionally not represented because the pinned source does not establish it.
      required: [alpha2, alpha3, numericCode, defaultName, officialName, selectedName, status, validity, provenance, catalogRevision, links]
      properties:
        alpha2:
          type: string
          pattern: '^[A-Z]{2}$'
        alpha3:
          type: string
          pattern: '^[A-Z]{3}$'
        numericCode:
          type: string
          pattern: '^[0-9]{3}$'
          description: String form preserves leading zeroes.
        defaultName:
          type: string
          minLength: 1
          maxLength: 500
        officialName:
          type: string
          minLength: 1
          maxLength: 500
          description: Falls back to the source `name` when no distinct official name exists.
        selectedName:
          $ref: '#/components/schemas/SelectedName'
        status:
          $ref: '#/components/schemas/LifecycleStatus'
        validity:
          $ref: '#/components/schemas/ValidityPeriod'
        provenance:
          $ref: '#/components/schemas/Provenance'
        catalogRevision:
          $ref: '#/components/schemas/CatalogRevision'
        links:
          $ref: '#/components/schemas/CountryLinks'
    CountryLinks:
      type: object
      additionalProperties: false
      required: [self, names, divisions]
      properties:
        self:
          type: string
          format: uri-reference
        names:
          type: string
          format: uri-reference
        divisions:
          type: string
          format: uri-reference
    LocalizedName:
      type: object
      additionalProperties: false
      description: Literal source-backed name record. Name-list filters match these fields exactly and never change the record through fallback.
      required: [value, language, nameType, preferred, validity, provenance]
      properties:
        value:
          type: string
          minLength: 1
          maxLength: 500
        language:
          type: string
          minLength: 2
          maxLength: 35
          x-normative-validator: java.util.Locale.Builder#setLanguageTag (Java 25)
        nameType:
          $ref: '#/components/schemas/NameType'
        preferred:
          type: boolean
        validity:
          $ref: '#/components/schemas/ValidityPeriod'
        provenance:
          $ref: '#/components/schemas/Provenance'
    DivisionType:
      type: object
      additionalProperties: false
      description: Active V1 division type returned by the type-list route. Each public code is const-coupled to its exact technical name and hierarchy level.
      required: [countryCode, code, name, hierarchyLevel, status, provenance, catalogRevision]
      properties:
        countryCode:
          type: string
          const: EC
        code:
          $ref: '#/components/schemas/DivisionTypeCode'
        name:
          type: string
          minLength: 1
          maxLength: 150
          description: English technical display name configured for the public type code.
        hierarchyLevel:
          type: integer
          minimum: 1
          maximum: 3
        status:
          $ref: '#/components/schemas/LifecycleStatus'
        provenance:
          $ref: '#/components/schemas/Provenance'
        catalogRevision:
          $ref: '#/components/schemas/CatalogRevision'
      oneOf:
        - title: Province type
          properties:
            code: {type: string, const: PROVINCE}
            name: {type: string, const: Province}
            hierarchyLevel: {type: integer, const: 1}
            status: {type: string, const: ACTIVE}
          required: [code, name, hierarchyLevel, status]
        - title: Canton type
          properties:
            code: {type: string, const: CANTON}
            name: {type: string, const: Canton}
            hierarchyLevel: {type: integer, const: 2}
            status: {type: string, const: ACTIVE}
          required: [code, name, hierarchyLevel, status]
        - title: Cantonal seat area type
          properties:
            code: {type: string, const: CANTONAL_SEAT_AREA}
            name: {type: string, const: Cantonal seat area}
            hierarchyLevel: {type: integer, const: 3}
            status: {type: string, const: ACTIVE}
          required: [code, name, hierarchyLevel, status]
        - title: Rural parish type
          properties:
            code: {type: string, const: RURAL_PARISH}
            name: {type: string, const: Rural parish}
            hierarchyLevel: {type: integer, const: 3}
            status: {type: string, const: ACTIVE}
          required: [code, name, hierarchyLevel, status]
    DivisionIdentifier:
      type: object
      additionalProperties: false
      description: Scheme and value are constrained as a pair. DPA values are exact digit strings; ISO subdivision values are canonical uppercase.
      required: [scheme, value, primary, status, validity, provenance]
      properties:
        scheme:
          type: string
          enum: [EC_INEC_DPA, ISO_3166_2]
        value:
          type: string
          minLength: 2
          maxLength: 6
        primary:
          type: boolean
        status:
          $ref: '#/components/schemas/IdentifierStatus'
        validity:
          $ref: '#/components/schemas/ValidityPeriod'
        provenance:
          $ref: '#/components/schemas/Provenance'
      oneOf:
        - title: INEC DPA identifier
          properties:
            scheme:
              type: string
              const: EC_INEC_DPA
            value:
              type: string
              pattern: '^(?:[0-9]{2}|[0-9]{4}|[0-9]{6})$'
          required: [scheme, value]
        - title: ISO 3166-2 province identifier
          properties:
            scheme:
              type: string
              const: ISO_3166_2
            value:
              type: string
              pattern: '^EC-[A-Z]{1,2}$'
          required: [scheme, value]
    DpaDivisionIdentifier:
      allOf:
        - $ref: '#/components/schemas/DivisionIdentifier'
        - type: object
          properties:
            scheme:
              type: string
              const: EC_INEC_DPA
          required: [scheme]
      description: DPA identifier branch used where array position and cardinality are fixed.
    Iso3166_2DivisionIdentifier:
      allOf:
        - $ref: '#/components/schemas/DivisionIdentifier'
        - type: object
          properties:
            scheme:
              type: string
              const: ISO_3166_2
          required: [scheme]
      description: ISO 3166-2 identifier branch used only as the second province identifier.
    ProvinceIdentifierList:
      type: array
      minItems: 2
      maxItems: 2
      uniqueItems: true
      prefixItems:
        - $ref: '#/components/schemas/DpaDivisionIdentifier'
        - $ref: '#/components/schemas/Iso3166_2DivisionIdentifier'
      items: false
      description: Exactly two identifiers in fixed order, DPA first and ISO 3166-2 second.
    DpaOnlyIdentifierList:
      type: array
      minItems: 1
      maxItems: 1
      prefixItems:
        - $ref: '#/components/schemas/DpaDivisionIdentifier'
      items: false
      description: Exactly one DPA identifier; ISO 3166-2 is prohibited for non-provinces.
    AdministrativeDivision:
      type: object
      additionalProperties: false
      description: Visible Ecuador division whose type, hierarchy level, canonical-code form, parent kind, ancestor chain, selected name, and identifiers satisfy one constrained V1 variant and the same query-date rules.
      x-parent-code-prefix-required: true
      x-dpa-identifier-equals-canonical-code: true
      required: [country, canonicalCode, type, hierarchyLevel, parent, defaultName, officialName, selectedName, identifiers, status, validity, provenance, catalogRevision, links]
      properties:
        country:
          $ref: '#/components/schemas/CountryReference'
        canonicalCode:
          type: string
          pattern: '^(?:[0-9]{2}|[0-9]{4}|[0-9]{6})$'
        type:
          $ref: '#/components/schemas/DivisionTypeCode'
        hierarchyLevel:
          type: integer
          minimum: 1
          maximum: 3
        parent:
          oneOf:
            - $ref: '#/components/schemas/DivisionReference'
            - type: 'null'
          description: Same-country immediate parent, or null only for a level-one province.
        defaultName:
          type: string
          minLength: 1
          maxLength: 500
        officialName:
          type: string
          minLength: 1
          maxLength: 500
        selectedName:
          $ref: '#/components/schemas/SelectedName'
        identifiers:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: '#/components/schemas/DivisionIdentifier'
          description: The selected division variant applies exact cardinality, order, and scheme constraints without an overlapping array union.
        status:
          $ref: '#/components/schemas/LifecycleStatus'
        validity:
          $ref: '#/components/schemas/ValidityPeriod'
        provenance:
          $ref: '#/components/schemas/Provenance'
        catalogRevision:
          $ref: '#/components/schemas/CatalogRevision'
        links:
          $ref: '#/components/schemas/DivisionLinks'
      oneOf:
        - title: Province
          properties:
            canonicalCode:
              type: string
              pattern: '^[0-9]{2}$'
            type:
              type: string
              const: PROVINCE
            hierarchyLevel:
              type: integer
              const: 1
            parent:
              type: 'null'
            identifiers:
              $ref: '#/components/schemas/ProvinceIdentifierList'
          required: [canonicalCode, type, hierarchyLevel, parent, identifiers]
        - title: Canton
          properties:
            canonicalCode:
              type: string
              pattern: '^[0-9]{4}$'
            type:
              type: string
              const: CANTON
            hierarchyLevel:
              type: integer
              const: 2
            parent:
              $ref: '#/components/schemas/ProvinceDivisionReference'
            identifiers:
              $ref: '#/components/schemas/DpaOnlyIdentifierList'
          required: [canonicalCode, type, hierarchyLevel, parent, identifiers]
        - title: Cantonal seat area
          properties:
            canonicalCode:
              type: string
              pattern: '^[0-9]{4}50$'
            type:
              type: string
              const: CANTONAL_SEAT_AREA
            hierarchyLevel:
              type: integer
              const: 3
            parent:
              $ref: '#/components/schemas/CantonDivisionReference'
            identifiers:
              $ref: '#/components/schemas/DpaOnlyIdentifierList'
          required: [canonicalCode, type, hierarchyLevel, parent, identifiers]
        - title: Rural parish
          properties:
            canonicalCode:
              type: string
              pattern: '^[0-9]{4}(?:5[1-9]|[6-9][0-9])$'
            type:
              type: string
              const: RURAL_PARISH
            hierarchyLevel:
              type: integer
              const: 3
            parent:
              $ref: '#/components/schemas/CantonDivisionReference'
            identifiers:
              $ref: '#/components/schemas/DpaOnlyIdentifierList'
          required: [canonicalCode, type, hierarchyLevel, parent, identifiers]
    DivisionLinks:
      type: object
      additionalProperties: false
      required: [self, names, children, ancestors]
      properties:
        self:
          type: string
          format: uri-reference
          pattern: '^/v1/countries/EC/divisions/(?:[0-9]{2}|[0-9]{4}|[0-9]{6})$'
        names:
          type: string
          format: uri-reference
          pattern: '^/v1/countries/EC/divisions/(?:[0-9]{2}|[0-9]{4}|[0-9]{6})/names$'
        children:
          type: string
          format: uri-reference
          pattern: '^/v1/countries/EC/divisions/(?:[0-9]{2}|[0-9]{4}|[0-9]{6})/children$'
        ancestors:
          type: string
          format: uri-reference
          pattern: '^/v1/countries/EC/divisions/(?:[0-9]{2}|[0-9]{4}|[0-9]{6})/ancestors$'
    PageMetadata:
      type: object
      additionalProperties: false
      required: [page, pageSize, hasNext]
      properties:
        page:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        pageSize:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        hasNext:
          type: boolean
          description: True only when at least one visible item exists after this page. No total count is promised or queried.
      example:
        page: 1
        pageSize: 50
        hasNext: false
    CountryPage:
      type: object
      additionalProperties: false
      required: [items, page, catalogRevision]
      properties:
        items:
          type: array
          minItems: 0
          maxItems: 100
          items:
            $ref: '#/components/schemas/Country'
        page:
          $ref: '#/components/schemas/PageMetadata'
        catalogRevision:
          $ref: '#/components/schemas/CatalogRevision'
    NamePage:
      type: object
      additionalProperties: false
      required: [items, page, catalogRevision]
      properties:
        items:
          type: array
          minItems: 0
          maxItems: 100
          items:
            $ref: '#/components/schemas/LocalizedName'
        page:
          $ref: '#/components/schemas/PageMetadata'
        catalogRevision:
          $ref: '#/components/schemas/CatalogRevision'
    DivisionTypePage:
      type: object
      additionalProperties: false
      required: [items, page, catalogRevision]
      properties:
        items:
          type: array
          minItems: 0
          maxItems: 100
          items:
            $ref: '#/components/schemas/DivisionType'
        page:
          $ref: '#/components/schemas/PageMetadata'
        catalogRevision:
          $ref: '#/components/schemas/CatalogRevision'
    DivisionPage:
      type: object
      additionalProperties: false
      required: [items, page, catalogRevision]
      properties:
        items:
          type: array
          minItems: 0
          maxItems: 100
          items:
            $ref: '#/components/schemas/AdministrativeDivision'
        page:
          $ref: '#/components/schemas/PageMetadata'
        catalogRevision:
          $ref: '#/components/schemas/CatalogRevision'
    AncestorList:
      type: object
      additionalProperties: false
      description: Immediate-parent-to-root result, bounded by the three-level V1 hierarchy.
      required: [items, catalogRevision]
      properties:
        items:
          type: array
          minItems: 0
          maxItems: 2
          items:
            $ref: '#/components/schemas/AdministrativeDivision'
        catalogRevision:
          $ref: '#/components/schemas/CatalogRevision'
    CatalogMetadata:
      type: object
      additionalProperties: false
      description: Revision-bound metadata. Examples show the initial approved revision; later immutable v1 catalog migrations may change source revisions, hashes, counts, dates, and exclusions within the fixed v1 type and identifier contract without changing this schema.
      required: [catalogRevision, migrationRevision, countryCoverage, divisionCoverage, exclusions]
      properties:
        catalogRevision:
          $ref: '#/components/schemas/CatalogRevision'
        migrationRevision:
          type: string
          pattern: '^V[0-9]{3,}$'
          maxLength: 50
          example: V003
          description: Immutable migration version that introduced the activated catalog revision.
        countryCoverage:
          $ref: '#/components/schemas/CountryCoverage'
        divisionCoverage:
          $ref: '#/components/schemas/DivisionCoverage'
        exclusions:
          type: array
          minItems: 0
          maxItems: 100
          items:
            $ref: '#/components/schemas/CatalogExclusion'
          description: Exact ordered exclusions declared by the activated revision. The initial approved revision contains the five values in the source manifest.
    CountryCoverage:
      type: object
      additionalProperties: false
      required: [scope, historicalCoverageStart, countries, nameRecords, nameCounts, languages, codeSchemes, source]
      properties:
        scope:
          type: string
          minLength: 1
          maxLength: 100
          example: ISO_3166_1_OFFICIALLY_ASSIGNED
        historicalCoverageStart:
          type: string
          format: date
          example: '2026-01-01'
        countries:
          type: integer
          minimum: 0
          example: 249
        nameRecords:
          type: integer
          minimum: 0
          example: 433
        nameCounts:
          $ref: '#/components/schemas/CountryNameCounts'
        languages:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            minLength: 2
            maxLength: 35
          example: [en]
        codeSchemes:
          type: array
          minItems: 3
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            enum: [ISO_3166_1_ALPHA_2, ISO_3166_1_ALPHA_3, ISO_3166_1_NUMERIC]
        source:
          $ref: '#/components/schemas/CountrySource'
    CountryNameCounts:
      type: object
      additionalProperties: false
      required: [SHORT, OFFICIAL, COMMON, ALTERNATIVE, HISTORICAL]
      properties:
        SHORT:
          type: integer
          minimum: 0
          example: 249
        OFFICIAL:
          type: integer
          minimum: 0
          example: 173
        COMMON:
          type: integer
          minimum: 0
          example: 11
        ALTERNATIVE:
          type: integer
          minimum: 0
          example: 0
        HISTORICAL:
          type: integer
          minimum: 0
          example: 0
    CountrySource:
      type: object
      additionalProperties: false
      required: [authority, dataset, revision, releaseDate, archiveSha256, iso3166_1Sha256, iso3166_2Sha256, license, authorityNote]
      properties:
        authority:
          type: string
          minLength: 1
          maxLength: 160
          example: Debian iso-codes project
        dataset:
          type: string
          minLength: 1
          maxLength: 200
          example: iso-codes ISO 3166 data files
        revision:
          type: string
          minLength: 1
          maxLength: 100
          example: 4.20.1
        releaseDate:
          type: string
          format: date
          example: '2026-01-01'
        archiveSha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
          example: 5d551f3ddb32548c4321e9011720fd97751af0107592f79ebffc939bd32f2268
        iso3166_1Sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
          example: f01b812b57fba9f31ff621bf33e7c7570a01964dbeb5be2167e94decf538c89f
        iso3166_2Sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
          example: 78c90ef7fc25b5c2631aac5f089bc9ff6ec22c025c05b6ddbc087a1f1be2e46a
        license:
          type: string
          minLength: 1
          maxLength: 100
          example: LGPL-2.1-or-later
        authorityNote:
          type: string
          minLength: 1
          maxLength: 500
          example: ISO-aligned open dataset; not an official ISO publication.
    DivisionCoverage:
      type: object
      additionalProperties: false
      required: [countryCode, historicalCoverageStart, sourceEffectiveDate, provinces, cantons, cantonalSeatAreas, ruralParishes, levelThreeAreas, divisions, nameRecords, dpaIdentifiers, iso3166_2Identifiers, divisionIdentifiers, languages, identifierSchemes, includedTypes, source]
      properties:
        countryCode:
          type: string
          const: EC
        historicalCoverageStart:
          type: string
          format: date
          example: '2026-01-01'
        sourceEffectiveDate:
          type: string
          format: date
          example: '2025-12-31'
        provinces:
          type: integer
          minimum: 0
          example: 24
        cantons:
          type: integer
          minimum: 0
          example: 222
        cantonalSeatAreas:
          type: integer
          minimum: 0
          example: 222
        ruralParishes:
          type: integer
          minimum: 0
          example: 825
        levelThreeAreas:
          type: integer
          minimum: 0
          example: 1047
        divisions:
          type: integer
          minimum: 0
          example: 1293
        nameRecords:
          type: integer
          minimum: 0
          example: 1293
        dpaIdentifiers:
          type: integer
          minimum: 0
          example: 1293
        iso3166_2Identifiers:
          type: integer
          minimum: 0
          example: 24
        divisionIdentifiers:
          type: integer
          minimum: 0
          example: 1317
          description: Total approved division identifiers across both schemes.
        languages:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            minLength: 2
            maxLength: 35
          example: [es]
        identifierSchemes:
          type: array
          minItems: 2
          maxItems: 2
          uniqueItems: true
          items:
            type: string
            enum: [EC_INEC_DPA, ISO_3166_2]
        includedTypes:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            $ref: '#/components/schemas/IncludedDivisionType'
        source:
          $ref: '#/components/schemas/DivisionSource'
    IncludedDivisionType:
      type: object
      additionalProperties: false
      required: [code, hierarchyLevel]
      properties:
        code:
          $ref: '#/components/schemas/DivisionTypeCode'
        hierarchyLevel:
          type: integer
          minimum: 1
          maximum: 3
    DivisionSource:
      type: object
      additionalProperties: false
      required: [authority, dataset, revision, effectiveDate, retrievedDate, archiveSha256, detailedArtifactSha256, compactArtifactSha256]
      properties:
        authority:
          type: string
          minLength: 1
          maxLength: 160
          example: Instituto Nacional de Estadistica y Censos del Ecuador (INEC)
        dataset:
          type: string
          minLength: 1
          maxLength: 200
          example: Clasificador Geografico Estadistico 2026
        revision:
          type: string
          minLength: 1
          maxLength: 100
          example: '2026'
        effectiveDate:
          type: string
          format: date
          example: '2025-12-31'
        retrievedDate:
          type: string
          format: date
          example: '2026-07-25'
        archiveSha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
          example: 9a2962bcccd88745dba4d61627e27945714049d97571d088e6c6b294be668a2c
        detailedArtifactSha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
          example: b6648d27906b12a12f310b30ed7a94c9efcdd0249eaa073647013f8b7029ba5d
        compactArtifactSha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
          example: 0d0ae33a0a0023ed44abcaa6b38a1c173fbda423e368a8f12bedda59d65d8f3a
    CatalogExclusion:
      type: object
      additionalProperties: false
      required: [coverageCode, exclusionCode, excludedCount, description]
      properties:
        coverageCode:
          type: string
          minLength: 1
          maxLength: 64
        exclusionCode:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{0,99}$'
        excludedCount:
          type: [integer, 'null']
          minimum: 0
        description:
          type: string
          minLength: 1
          maxLength: 500
    HealthResponse:
      type: object
      additionalProperties: false
      description: Common successful health representation. Route-specific schemas constrain `check` and active-revision requirements. DOWN and error states use RFC 9457 problems.
      required: [status, check, service, applicationVersion, buildRevision, expectedCatalogRevision, activeCatalogRevision, observedAt]
      properties:
        status:
          type: string
          const: UP
        check:
          type: string
          enum: [LIVENESS, READINESS, STARTUP]
        service:
          type: string
          const: geographic-reference-service
        applicationVersion:
          type: string
          minLength: 1
          maxLength: 100
        buildRevision:
          type: string
          minLength: 7
          maxLength: 64
          pattern: '^[A-Fa-f0-9]+$'
        expectedCatalogRevision:
          $ref: '#/components/schemas/CatalogRevision'
        activeCatalogRevision:
          oneOf:
            - $ref: '#/components/schemas/CatalogRevision'
            - type: 'null'
          description: Verified revision for readiness/startup; may be null for dependency-independent liveness.
        observedAt:
          type: string
          format: date-time
    LivenessHealthResponse:
      allOf:
        - $ref: '#/components/schemas/HealthResponse'
        - type: object
          properties:
            check:
              type: string
              const: LIVENESS
          required: [check]
      description: Liveness success. Active catalog revision may be null because temporary database loss does not make liveness fail.
    ReadinessHealthResponse:
      allOf:
        - $ref: '#/components/schemas/HealthResponse'
        - type: object
          properties:
            check:
              type: string
              const: READINESS
            activeCatalogRevision:
              $ref: '#/components/schemas/CatalogRevision'
          required: [check, activeCatalogRevision]
      description: Readiness success with the active revision verified equal to the expected revision.
    StartupHealthResponse:
      allOf:
        - $ref: '#/components/schemas/HealthResponse'
        - type: object
          properties:
            check:
              type: string
              const: STARTUP
            activeCatalogRevision:
              $ref: '#/components/schemas/CatalogRevision'
          required: [check, activeCatalogRevision]
      description: Startup success after configuration, schema, completeness, and expected revision verification.
    InfoResponse:
      type: object
      additionalProperties: false
      required: [service, applicationVersion, buildRevision, expectedCatalogRevision, activeCatalogRevision, coverage, observedAt]
      properties:
        service:
          type: string
          const: geographic-reference-service
        applicationVersion:
          type: string
          minLength: 1
          maxLength: 100
        buildRevision:
          type: string
          minLength: 7
          maxLength: 64
          pattern: '^[A-Fa-f0-9]+$'
        expectedCatalogRevision:
          $ref: '#/components/schemas/CatalogRevision'
        activeCatalogRevision:
          oneOf:
            - $ref: '#/components/schemas/CatalogRevision'
            - type: 'null'
          description: Active revision when safely available; null does not disclose dependency diagnostics.
        coverage:
          $ref: '#/components/schemas/InfoCoverage'
        observedAt:
          type: string
          format: date-time
    InfoCoverage:
      type: object
      additionalProperties: false
      required: [countryRecords, divisionCountryCodes, divisionRecords, countryHistoricalCoverageStart, divisionHistoricalCoverageStart, hierarchyLevels]
      properties:
        countryRecords:
          type: integer
          minimum: 0
          example: 249
        divisionCountryCodes:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
            const: EC
        divisionRecords:
          type: integer
          minimum: 0
          example: 1293
        countryHistoricalCoverageStart:
          type: string
          format: date
          example: '2026-01-01'
        divisionHistoricalCoverageStart:
          type: string
          format: date
          example: '2026-01-01'
        hierarchyLevels:
          type: integer
          const: 3
    OpenMetricsResponse:
      type: string
      description: |
        OpenMetrics 1.0 exposition ending in `# EOF`. Required metric families cover HTTP
        request count and duration, errors, not-found outcomes, database pool utilization,
        reactive connection acquisition duration, query count by route category, readiness,
        and current catalog revision. No secret-bearing labels or runtime mutation metrics
        are permitted.
      minLength: 6
      maxLength: 1048576
      pattern: '^[\s\S]*# EOF\n?$'
      example: |
        # HELP geographic_reference_http_requests_total Total HTTP requests handled.
        # TYPE geographic_reference_http_requests_total counter
        geographic_reference_http_requests_total{route_category="catalog",status="200"} 42
        # HELP geographic_reference_http_request_duration_seconds HTTP request duration in seconds.
        # TYPE geographic_reference_http_request_duration_seconds histogram
        geographic_reference_http_request_duration_seconds_bucket{route_category="catalog",le="0.01"} 18
        geographic_reference_http_request_duration_seconds_bucket{route_category="catalog",le="0.1"} 40
        geographic_reference_http_request_duration_seconds_bucket{route_category="catalog",le="+Inf"} 42
        geographic_reference_http_request_duration_seconds_count{route_category="catalog"} 42
        geographic_reference_http_request_duration_seconds_sum{route_category="catalog"} 1.25
        # HELP geographic_reference_errors_total Total request errors by stable code.
        # TYPE geographic_reference_errors_total counter
        geographic_reference_errors_total{code="INTERNAL_ERROR"} 0
        # HELP geographic_reference_not_found_total Total not-found outcomes by resource.
        # TYPE geographic_reference_not_found_total counter
        geographic_reference_not_found_total{resource="country"} 1
        # HELP geographic_reference_db_pool_in_use Reactive database connections currently in use.
        # TYPE geographic_reference_db_pool_in_use gauge
        geographic_reference_db_pool_in_use 1
