openapi: 3.1.1
info:
  title: Geographic Reference Service API
  version: 1.0.0
  summary: Authenticated, read-only geographic reference catalog and operations API.
  license:
    name: Internal use only
    identifier: LicenseRef-Internal-Use-Only
  description: |
    Canonical Phase 1 contract for the immutable geographic catalog. The catalog surface
    exposes only the activated catalog revision and never mutates catalog data. Catalog
    routes require `geographic-reference.read`; operational routes require
    `geographic-reference.observe`.

    Current catalog queries use the current UTC calendar date and expose only `ACTIVE`
    records whose half-open validity interval contains that date. Explicit historical
    queries use `asOf` and may expose `ACTIVE`, `DEPRECATED`, or `RETIRED` records valid on
    that date. `DRAFT` is never externally visible. A non-null `validFrom` is inclusive, a
    non-null `validUntil` is exclusive, and null is an open boundary. Historical queries
    before the effective endpoint coverage start are rejected rather than inferred.

    Presentation-name selection uses the requested canonical BCP 47 tag, then its primary
    language, then the entity default name. Name-list `language` and `nameType` parameters
    are literal filters and do not invoke fallback. Collection order and bounds are fixed by
    each operation. Unknown query parameters and repeated singleton query parameters are
    rejected.

    Successful catalog responses use private revalidation. Their weak ETag covers the
    catalog revision, normalized request dimensions, effective UTC date, media type, and
    authorization representation variant. `If-None-Match` is evaluated only after access,
    input, dependency, coverage, and resource checks. ETags are cache validators only and
    grant no update rights. Unsupported methods on a declared path return RFC 9457
    `METHOD_NOT_ALLOWED` with `Allow: GET, HEAD`; no such method is declared as an operation.
servers:
  - url: /
    description: Gateway-relative service root.
tags:
  - name: Catalog
    description: Activated catalog metadata.
  - name: Countries
    description: ISO-aligned countries, territories, and their names.
  - name: Divisions
    description: Bounded Ecuador political-administrative reference queries.
  - name: Health
    description: Authenticated liveness, readiness, and startup observations.
  - name: Operations
    description: Authenticated metrics and build/catalog information.
x-method-not-allowed-response:
  description: A method other than GET or HEAD on any declared path returns this RFC 9457 response without evaluating catalog input or resource existence.
  headers:
    Allow:
      description: Complete safe-method allowlist for every declared path.
      required: true
      schema:
        type: string
        const: GET, HEAD
      example: GET, HEAD
    Cache-Control:
      $ref: '#/components/headers/NoStoreCacheControl'
    Date:
      $ref: '#/components/headers/ResponseDate'
    X-Trace-Id:
      $ref: '#/components/headers/TraceId'
  content:
    application/problem+json:
      schema:
        $ref: '#/components/schemas/MethodNotAllowedProblem'
      example:
        type: urn:problem-type:geographic-reference:method-not-allowed
        title: Method not allowed
        status: 405
        detail: This resource supports only GET and HEAD.
        instance: /v1/countries
        code: METHOD_NOT_ALLOWED
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
paths:
  /v1/catalog:
    get:
      tags: [Catalog]
      operationId: getCatalog
      summary: Get activated catalog metadata
      description: |
        Returns exact source, coverage, count, language, identifier, migration, and exclusion
        metadata for the one activated revision. No query parameters are accepted.
      security:
        - bearerAuth: []
      x-required-permissions: [geographic-reference.read]
      x-validation-order: [authentication, authorization, unsupported-query-parameter, catalog-dependency-and-expected-revision, catalog-metadata-resolution, if-none-match]
      x-error-codes-by-status:
        '400': [UNSUPPORTED_QUERY_PARAMETER]
        '401': [AUTHENTICATION_REQUIRED]
        '403': [ACCESS_DENIED]
        '500': [INTERNAL_ERROR]
        '503': [GEOGRAPHIC_CATALOG_UNAVAILABLE, GEOGRAPHIC_CATALOG_TIMEOUT, CATALOG_REVISION_MISMATCH]
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          $ref: '#/components/responses/CatalogMetadataOk'
        '304':
          $ref: '#/components/responses/CatalogNotModified'
        '400':
          $ref: '#/components/responses/UnsupportedQueryBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    head:
      tags: [Catalog]
      operationId: headCatalog
      summary: Validate activated catalog metadata without a body
      description: Executes the same access, validation, dependency, resolution, and cache pipeline as GET and returns identical status and headers with no response body.
      security:
        - bearerAuth: []
      x-required-permissions: [geographic-reference.read]
      x-validation-order: [authentication, authorization, unsupported-query-parameter, catalog-dependency-and-expected-revision, catalog-metadata-resolution, if-none-match]
      x-head-response-body: forbidden
      x-error-codes-by-status:
        '400': [UNSUPPORTED_QUERY_PARAMETER]
        '401': [AUTHENTICATION_REQUIRED]
        '403': [ACCESS_DENIED]
        '500': [INTERNAL_ERROR]
        '503': [GEOGRAPHIC_CATALOG_UNAVAILABLE, GEOGRAPHIC_CATALOG_TIMEOUT, CATALOG_REVISION_MISMATCH]
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          $ref: '#/components/responses/CatalogHeadOk'
        '304':
          $ref: '#/components/responses/CatalogNotModified'
        '400':
          $ref: '#/components/responses/HeadBadRequest'
        '401':
