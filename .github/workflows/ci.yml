name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  POSTGRES_IMAGE: docker.io/library/postgres:18@sha256:d93de42662696f278fb34354b06fdaa90ad7ca3106d6f72fbd01d16da006d2cf
  TRIVY_IMAGE: docker.io/aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
  GITLEAKS_IMAGE: docker.io/zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Enforce pre-approval artifact boundary
        shell: bash
        run: |
          test ! -e database/migration/V002__load_initial_catalog_candidate.sql
          test ! -e database/migration/V003__validate_activate_initial_catalog.sql
          test ! -e build/catalog/smoke-fixture.json

      - name: Verify formatting and default tests
        run: ./gradlew --no-daemon --dependency-verification strict spotlessCheck check

      - name: Verify architecture, reactive, security, contract, and documentation suites
        run: >-
          ./gradlew --no-daemon --dependency-verification strict
          architectureTest reactiveTest oidcSecurityTest openApiContractTest
          routeInventoryTest packagedOpenApiTest documentationTest

      - name: Verify PostgreSQL 18 suites
        run: >-
          ./gradlew --no-daemon --dependency-verification strict
          postgresIntegrationTest migrationTest runtimePrivilegeTest
          -PcatalogFixtureProfile=synthetic
          -Dtestcontainers.reuse.enable=false

      - name: Verify blocked-event-loop detector canary
        shell: bash
        run: |
          CANARY_SOURCE="src/test/java/com/alexastudillo/geographicreference/support/BlockedEventLoopCanaryTest.java"
          CANARY_REPORT="build/test-results/blockingCanary/TEST-com.alexastudillo.geographicreference.support.BlockedEventLoopCanaryTest.xml"
          CANARY_LOG="/tmp/grs-blocking-canary.log"
          if [[ -f "$CANARY_SOURCE" ]]; then
            rm -f "$CANARY_REPORT" "$CANARY_LOG"
            if ./gradlew --no-daemon --dependency-verification strict blockingCanary --rerun-tasks >"$CANARY_LOG" 2>&1; then
              printf '%s\n' "known event-loop blocking canary unexpectedly passed" >&2
              exit 1
            fi
            test -s "$CANARY_REPORT"
            grep -Eq '<failure[^>]*message="EXPECTED_BLOCKED_EVENT_LOOP_CANARY: BlockedThreadChecker[^"]*"' "$CANARY_REPORT"
          fi

      - name: Verify static analysis and JVM build
        run: ./gradlew --no-daemon --dependency-verification strict spotbugsMain quarkusBuild

      - name: Verify runtime dependency boundary
        shell: bash
        run: |
          ./gradlew --no-daemon --dependency-verification strict dependencies --configuration runtimeClasspath > /tmp/grs-runtime-classpath.txt
          ! grep -Eiq 'flyway|org\.postgresql:postgresql|testcontainers|archunit|swagger-parser' /tmp/grs-runtime-classpath.txt
          grep -q 'quarkus-reactive-pg-client' /tmp/grs-runtime-classpath.txt

      - name: Retain build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gradle-verification-reports
          if-no-files-found: warn
          path: |
            build/reports/
            build/test-results/

  pre-approval-supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out full history
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Pull digest-pinned scanners
        run: |
          docker pull "$TRIVY_IMAGE"
          docker pull "$GITLEAKS_IMAGE"

      - name: Generate and scan filesystem SBOM
        shell: bash
        run: |
          mkdir -p build/reports/sbom
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/workspace" -w /workspace \
            "$TRIVY_IMAGE" fs --format cyclonedx \
            --output /workspace/build/reports/sbom/filesystem.cdx.json /workspace
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/workspace" -w /workspace \
            "$TRIVY_IMAGE" sbom --exit-code 1 --severity HIGH,CRITICAL \
            /workspace/build/reports/sbom/filesystem.cdx.json

      - name: Scan repository and Git history
        shell: bash
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/workspace" -w /workspace \
            "$TRIVY_IMAGE" fs --exit-code 1 --severity HIGH,CRITICAL \
            --scanners vuln,misconfig,secret /workspace
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace" -w /workspace \
            "$GITLEAKS_IMAGE" git --redact --no-banner .

      - name: Retain SBOM evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: filesystem-sbom
          if-no-files-found: error
          path: build/reports/sbom/filesystem.cdx.json
